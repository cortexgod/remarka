[package]
name = "remarka"
version = "0.1.0"
description = "Ремарка — анализ речи на созвонах"
authors = ["Remarka"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "remarka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
hound = "3.5"
rusqlite = { version = "0.40", features = ["bundled"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
